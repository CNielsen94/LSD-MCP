[project]
name = "lsd-mcp"
version = "0.1.0"
description = "MCP server for working with LSD (Laboratory for Simulation Development)"
readme = "README.md"
authors = [
    { name = "Christian Nielsen", email = "pwnstarx3@live.dk" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2.0",
]

[project.scripts]
lsd-mcp = "lsd_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
